# Recolección semanal: consulta las fuentes y publica los datos nuevos.
# La raíz de este repositorio es la que publica GitHub Pages.
name: Actualizar datos

on:
  schedule:
    - cron: "0 6 * * 1"   # lunes 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 75   # arXiv por título tarda ~15 min (17,5 el 17-nov) + posible reintento de Semantic Scholar (~20 min)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Recolectar
        env:
          CONTACTO_API: ${{ vars.CONTACTO_API }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: python scripts/actualizar.py
      - name: Publicar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos/
          git diff --cached --quiet || git commit -m "datos: actualización semanal $(date +%F)"
          git push
      # Si Semantic Scholar pidió esperar (429), el panel ya dice "se vuelve a consultar en unos minutos".
      - name: Reintentar Semantic Scholar
        env:
          CONTACTO_API: ${{ vars.CONTACTO_API }}
        run: |
          if python -c "import json,sys; e=json.load(open('datos/fuentes.json'))['estado'].get('s2',{}); sys.exit(0 if e.get('estado')=='espera' else 1)"; then
            sleep 600
            python scripts/actualizar.py --solo-s2
            git add datos/
            git diff --cached --quiet || git commit -m "datos: reintento de Semantic Scholar $(date +%F)"
            git push
          fi
